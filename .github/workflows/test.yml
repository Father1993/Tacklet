name: CI and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK introspection packages
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-gi gir1.2-gtk-4.0 xdotool
      - name: Run checks
        run: |
          python3 -c "import gi; gi.require_version('Gtk', '4.0'); from gi.repository import Gtk"
          python3 -m compileall -q sticky tacklet.py
          python3 -m unittest discover -s tests -v

  release:
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install package build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes debhelper-compat dh-python lintian desktop-file-utils \
            python3-gi gir1.2-gtk-4.0 xdotool
      - name: Build and validate Debian package
        run: |
          dpkg-buildpackage -us -uc -b
          mkdir dist
          cp ../tacklet_*_all.deb dist/
          lintian --fail-on error dist/*.deb
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb | grep -F 'usr/bin/tacklet'
          dpkg-deb --contents dist/*.deb | grep -F 'usr/lib/tacklet/sticky/diagnostics.py'
      - name: Install package in a clean runner
        run: |
          sudo apt-get install --yes ./dist/*.deb
          tacklet --version
          tacklet --diagnose
      - name: Create checksums and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum *.deb > SHA256SUMS)
          gh release create "${GITHUB_REF_NAME}" dist/*.deb dist/SHA256SUMS \
            --verify-tag --title "Tacklet ${GITHUB_REF_NAME#v}" --generate-notes
